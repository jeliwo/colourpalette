<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Palette Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <span>Hit Spacebar to generate new palette!</span>
    <span class="mode">
      <span id="src">Connecting…</span> ·
      <label>Scheme <select id="mode">
        <option value="random">Random</option><option>analogic</option><option>monochrome</option>
        <option>complement</option><option>triadic</option><option>quad</option><option>analogic-complement</option>
      </select></label>
    </span>
  </header>
  <div id="panels" class="single"></div>
  <div class="more" id="more" hidden><button class="btn" id="addMore">Add More</button></div>
  <footer id="credits">
  Colour data from <a href="https://www.thecolorapi.com" target="_blank" rel="noopener">The Color API</a>.
  Built for a School Project
</footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const API = "https://www.thecolorapi.com/scheme";
const MODES = ["analogic","monochrome","complement","triadic","quad","analogic-complement"];
const MAX_PANELS = 4, MAX_COLORS = 9;
let panels = [], active = null, nextId = 1;

const $ = s => document.querySelector(s);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[rnd(0,a.length-1)];

/* ---------- color helpers ---------- */
function hslToHex(h,s,l){
  h=((h%360)+360)%360; s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
  return [f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
}
function inkFor(hex){
  const [r,g,b]=[0,2,4].map(i=>parseInt(hex.substr(i,2),16)/255)
    .map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));
  return (.2126*r+.7152*g+.0722*b)>.4?"#111":"#fff";
}

/* ---------- data: The Color API with offline fallback ---------- */
async function fetchPalette(){
  const hex = hslToHex(rnd(0,359), rnd(45,95), rnd(35,65));
  const sel = $("#mode").value;
  const mode = sel==="random" ? pick(MODES) : sel;
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(),6000);
    const res = await fetch(`${API}?hex=${hex}&mode=${mode}&count=${MAX_COLORS}&format=json`,{signal:ctl.signal});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    $("#src").textContent = "Live from The Color API";
    return data.colors.map(c=>({hex:c.hex.clean, name:c.name.value}));
  }catch(e){
    $("#src").textContent = "Offline mode (local colours)";
    return localPalette(mode);
  }
}
function localPalette(mode){
  const h=rnd(0,359), s=rnd(50,90), out=[];
  const offs={analogic:[0,30,60,90,-30],monochrome:[0],complement:[0,180],triadic:[0,120,240],quad:[0,90,180,270],"analogic-complement":[0,30,60,180]}[mode];
  for(let i=0;i<MAX_COLORS;i++){
    const o=offs[i%offs.length], l=mode==="monochrome"?20+i*8:30+((i*17)%45);
    out.push({hex:hslToHex(h+o,s,l),name:""});
  }
  return out;
}

/* ---------- state + render ---------- */
async function newPanel(){
  const p={id:nextId++,n:5,colors:await fetchPalette()};
  panels.push(p); active=p.id; render();
}
async function regenerate(){
  const p=panels.find(x=>x.id===active); if(!p) return;
  p.colors=await fetchPalette(); render();
}
function removePanel(id){
  panels=panels.filter(p=>p.id!==id);
  if(active===id) active=panels[panels.length-1].id;
  render();
}
function render(){
  const root=$("#panels"), multi=panels.length>1;
  root.className=multi?"compare":"single";
  root.innerHTML="";
  panels.forEach(p=>{
    const el=document.createElement("section");
    el.className="panel"+(p.id===active?" active":"");
    el.setAttribute("aria-label","Palette "+p.id);
    el.addEventListener("click",()=>{ if(active!==p.id){active=p.id;render();} });
    const bar = multi ? `<div class="bar"><button class="rm" data-rm="${p.id}">Remove</button></div>` : "";
    const add = !multi ? `<button class="btn add" data-add>Add</button>` : "";
    const sw = p.colors.slice(0,p.n).map(c=>{
      const ink=inkFor(c.hex);
      return `<button class="sw" style="background:#${c.hex};color:${ink}" data-hex="${c.hex}" title="Copy #${c.hex}">#${c.hex}<small>${c.name||""}</small></button>`;
    }).join("");
    el.innerHTML=`${add}${bar}<div class="swatches">${sw}</div>
      <div class="slider"><input type="range" min="1" max="9" step="1" value="${p.n}" aria-label="Number of colours">
      <div class="ticks"><span>1</span><span>3</span><span>5</span><span>7</span><span>9</span></div></div>`;
    el.querySelector("input").addEventListener("input",e=>{
      p.n=+e.target.value;
      el.querySelector(".swatches").innerHTML=p.colors.slice(0,p.n).map(c=>
        `<button class="sw" style="background:#${c.hex};color:${inkFor(c.hex)}" data-hex="${c.hex}" title="Copy #${c.hex}">#${c.hex}<small>${c.name||""}</small></button>`).join("");
    });
    root.appendChild(el);
  });
  $("#more").hidden=!multi||panels.length>=MAX_PANELS;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const rm=e.target.closest("[data-rm]"); if(rm){e.stopPropagation();removePanel(+rm.dataset.rm);return;}
  if(e.target.closest("[data-add]")){e.stopPropagation();newPanel();return;}
  const sw=e.target.closest(".sw");
  if(sw){navigator.clipboard?.writeText("#"+sw.dataset.hex).then(()=>toast("Copied #"+sw.dataset.hex)).catch(()=>toast("#"+sw.dataset.hex));}
});
$("#addMore").addEventListener("click",newPanel);
document.addEventListener("keydown",e=>{
  if(e.code==="Space" && !/^(INPUT|SELECT|BUTTON|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); regenerate();
  }
});
$("#mode").addEventListener("change",regenerate);
let t;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(t);t=setTimeout(()=>el.classList.remove("on"),1400);}

newPanel();
</script>
</body>
</html>
